# SPDX-License-Identifier: MIT
#
# Base CI from WP 0.1 (typecheck, lint, test, migration-test, openapi-current)
# plus WP 0.4's supply-chain gates: gitleaks over full history, the license
# gate, compose hardening, trivy (filesystem and per-image), and per-image
# SBOMs. Cosign signing and the multi-arch GHCR publish live in release.yml,
# tags only — nothing here pushes anywhere. Job names are stable; add jobs
# rather than renaming these.
#
# RUN THIS LOCALLY BEFORE PUSHING: `just verify` runs the same gates in the
# same order with the same pinned tool digests (gitleaks, license gate +
# THIRD_PARTY drift, compose hardening incl. its self-test, .trivyignore
# expiry, trivy fs). `just check` is typecheck/lint/test only — it was being
# read as "CI will pass" through all of Phase 0 while CI was red at HEAD, which
# is how four broken gates went unnoticed. A green `just verify` is the claim;
# `just check` is not.
#
# VITEST PROJECT -> CI JOB MAP (gate-remediation-2.md finding 1, updated for
# gate-security-review-2.md R-3, updated again by wp1.7-quality.md: Phase 1
# added seven new projects — ledger, ledger-db, categorization,
# categorization-db, connector-port, connector-manual, connector-csv,
# connector-plaid, connections, connections-db — none of which had been added
# to either job, so the entire ledger, categorization, connector and
# connections suites ran only when a developer happened to run `just test`
# locally. Same failure mode as gate-remediation-2.md finding 1 (4 of 13
# projects), recurring on the projects Phase 1 itself introduced. `vitest.config.ts`
# defines every project below. Every project vitest knows about now appears in
# at least one job below, and `testkit` deliberately appears in *two*:
#
#   `test` (no Postgres, no DATABASE_URL):
#     kernel, config, api, platform, testkit, seed, secretbox, identity,
#     ledger, categorization, connector-port, connector-manual, connector-csv,
#     connector-plaid, connections, recurring, budgeting, notifications,
#     insights, investments, integrations, planning, connector-coinbase,
#     connector-walletrpc, scripts
#
#   `scripts` (WP 3.14) is the repo-checks project: it is rooted at the repo
#   root rather than at a package and runs scripts/**/*.test.ts. It reads
#   checked-in files only — no Postgres, no build — so it belongs in `test`.
#   `migration-test` (Postgres 18 service, DATABASE_URL set):
#     db, platform-db, secretbox-db, identity-db, api-db, testkit, ledger-db,
#     categorization-db, connections-db, recurring-db, budgeting-db,
#     notifications-db, insights-db, investments-db, integrations-db, planning-db
#   `web` (apps/web has its own vitest config, not part of the root one):
#     web (vitest), plus Playwright projects `chromium` (smoke) and `csp`
#
# connector-plaid needs neither: it is driven end to end by a hermetic
# FakePlaidApi over recorded-shape fixtures (see vitest.config.ts's own
# comment on that project). Its one live-network file, test/sandbox.test.ts,
# skips itself when PLAID_CLIENT_ID/PLAID_SECRET are unset, which they are in
# CI, so it is safe in the no-Postgres `test` job alongside the rest of the
# connector-plaid project.
#
# R-3: `testkit`'s own `describe.skipIf(ADMIN_URL === undefined)` suites
# (packages/testkit/test/database.test.ts — the harness `platform-db`,
# `secretbox-db`, `identity-db` and `api-db` are all built on) ran in neither
# job: `test` sets no DATABASE_URL, so they skipped there, and `testkit` was
# absent from `migration-test`'s project list entirely. Re-running the whole
# `testkit` project in `migration-test` (where DATABASE_URL is set) is
# deliberately redundant with the plain-unit share of it already covered by
# `test` — a project split by database-dependence, like the `*-db` projects,
# would avoid the overlap, but duplicating a few seconds of unit tests is
# cheaper than a second migration to get there.
#
# Re-verify this map with, per project: `pnpm exec vitest list --project
# <name> --filesOnly` (root config) or `pnpm --filter @app/web exec vitest
# list --filesOnly` (web); Playwright projects via `pnpm --filter @app/web
# exec playwright test --list`.
#
# WP 2.12: the map above is re-verified current as of Phase 2's 31 root
# projects (8 Phase 0 + 10 Phase 1 + 13 Phase 2: recurring/-db,
# budgeting/-db, notifications/-db, insights/-db, plus api/api-db which
# predate Phase 2), and is no longer hand-verified only — `node
# scripts/check-ci-projects.ts` (wired into `just check`'s body and this
# file's own `lint` job, "every vitest project is covered by a CI job")
# parses this exact map's two --project lists against vitest.config.ts and
# fails on the Phase 0/Phase 1 shape (a project in neither list), the
# reverse (a stale name in a list), or a project in the wrong job (db-shaped
# vs not). It does not replace this comment — a human still has to say *why*
# a project is where it is, which the check cannot know — only the "is
# everything actually listed somewhere" half.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Postinstall scripts are disabled repo-wide; nothing in CI may re-enable them.
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # pnpm is installed from a pinned version rather than via a third-party
      # action: one fewer supply-chain edge for the same result.
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    name: lint (eslint + boundaries + schema ownership)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile

      - name: formatting
        run: pnpm run lint:format

      # Includes personalfi/layer-imports: a context importing another context,
      # the kernel importing infrastructure, process.env outside @core/config, or
      # a wall-clock read outside Clock all fail here.
      - name: eslint and import boundaries
        run: pnpm run lint:eslint

      - name: schema ownership
        run: pnpm run lint:schema-ownership

      # gate-security-review.md F-4/C-1b: parses packages/contracts/openapi/
      # openapi.json's servers url and top-level path prefixes against
      # docker/Caddyfile's routed prefixes — the control whose absence let F-4
      # (Caddy proxying 3 of 11 API prefixes) ship silently for a full phase.
      # No database, no build: a static, checked-in-files-only check, same
      # shape as the three steps above.
      - name: proxy routes match the contract
        run: node scripts/check-proxy-routes.ts

      # WP 2.12 (docs/plan/02-phase-2-dispatch.md §5 item 5): the mechanical
      # check behind this file's own header comment above — parses every
      # vitest.config.ts project name and both --project lists below, fails
      # if a project is in neither list, in the wrong job (db-shaped vs not),
      # or if a list names a project that no longer exists. Self-tests
      # against fixtures first (`--self-test`, run unconditionally by the
      # plain invocation too) so the check itself is never a control nobody
      # has watched fail.
      - name: every vitest project is covered by a CI job
        run: node scripts/check-ci-projects.ts

      # WP 3.14 (docs/plan/03-phase-3-dispatch.md §3): 08 §6.5's rule — no
      # `number` in an identifier matching /amount|balance|price|value|cost|
      # quantity/ — over packages/** and apps/api/src/**, plus `toFixed` on a
      # magnitude (the Phase 1 `toFixed(18)` bug). Self-tests against
      # scripts/fixtures/numeric-{bad,good}.ts before it reads the tree, same
      # shape as the two checks above. The vitest half runs in the `test` job's
      # `scripts` project.
      - name: no float at a money or quantity boundary
        run: node scripts/check-numeric-boundaries.ts

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile

      # No DATABASE_URL: every project here skips or has no database-dependent
      # tests, proving the unit suite genuinely needs no Postgres. This must
      # list every root-config vitest project EXCEPT the `*-db`/`db`
      # projects (those run in `migration-test`, which has Postgres) — see the
      # project -> job map at the top of this file.
      - name: unit tests
        run: |
          pnpm exec vitest run \
            --project kernel --project config --project api \
            --project platform --project testkit --project seed \
            --project secretbox --project identity \
            --project ledger --project categorization \
            --project connector-port --project connector-manual \
            --project connector-csv --project connector-plaid --project connector-coinbase \
            --project connector-walletrpc \
            --project connections --project recurring --project budgeting \
            --project notifications --project insights --project investments \
            --project integrations --project planning --project scripts

  migration-test:
    name: migration test (postgres 18)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: personalfi
          POSTGRES_PASSWORD: personalfi
          POSTGRES_DB: personalfi_ci
          POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personalfi -d personalfi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://personalfi:personalfi@127.0.0.1:5432/personalfi_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile

      # The migrate CLI loads @core/config, and `master_key` is required for the
      # api/worker/cli roles but not for `migrator` (packages/config/src/
      # schema.ts). The first real CI run (2026-09-21) failed here with
      # "secret:master_key: is missing" because no ROLE was set and the default
      # is `api`. The compose migrator service has always run as ROLE=migrator;
      # CI now does the same rather than minting a throwaway key it must never
      # hold.
      - name: apply migrations to an empty database
        run: pnpm run migrate
        env:
          ROLE: migrator

      - name: applying twice is a no-op
        run: pnpm run migrate
        env:
          ROLE: migrator

      # Covers the advisory lock, transactional rollback, checksum drift, and the
      # node-postgres type parsers that money and quantity correctness rest on.
      #
      # Every other `*-db` project needs the same real Postgres and none of
      # them is otherwise exercised in CI (see the project -> job map at the
      # top of this file) — `TEST_ADMIN_DATABASE_URL` falls back to
      # `DATABASE_URL` (packages/testkit/test/database.ts), which is already
      # set above, so no extra secret is needed for the scratch databases
      # these create.
      #
      # `--project testkit` (gate-security-review-2.md R-3): with no
      # DATABASE_URL, the `test` job's run of this same project skips
      # `packages/testkit/test/database.test.ts`'s `describe.skipIf(ADMIN_URL
      # === undefined)` suites — the harness every `*-db` project depends on —
      # so those tests ran in neither job until now. Re-running here, where
      # DATABASE_URL is set, is what actually exercises them; re-running the
      # rest of `testkit`'s (already-covered) unit tests alongside them is
      # harmless duplication, not a gap.
      - name: migration and db-dependent integration tests
        run: |
          pnpm exec vitest run \
            --project db --project platform-db --project secretbox-db \
            --project identity-db --project api-db --project testkit \
            --project ledger-db --project categorization-db \
            --project connections-db --project recurring-db --project budgeting-db \
            --project notifications-db --project insights-db --project investments-db \
            --project integrations-db --project planning-db

  web:
    name: web (unit, build, playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile

      # apps/web/src/api/generated is gitignored (a per-install artifact). The
      # `typecheck` and `build` scripts regenerate it themselves; `test` does
      # not, and the first real CI run (2026-09-21, after the first push)
      # failed 21 of 42 web suites on "Failed to resolve import
      # ../api/generated/client.gen.ts". Locally this never showed because a
      # developer has always run typecheck or build first.
      - name: generate the OpenAPI client
        run: pnpm --filter @app/web gen

      # The `web` vitest project: apps/web has its own vitest config (happy-dom
      # environment), separate from the root one, so it is never covered by
      # the `test` job above.
      - name: unit tests
        run: pnpm --filter @app/web test

      # Runs strip-sourcemaps, check-sw-precache (the dev kitchen-sink precache
      # exclusion, verified against the shipped artifact — gate-remediation-2.md
      # finding 2) and check-csp against the production build.
      - name: build
        run: pnpm --filter @app/web build

      # Both Playwright projects: `chromium` (smoke.spec.ts, a real browser
      # boot of the app shell) and `csp` (csp.spec.ts, the only check in this
      # repo that observes a *runtime* CSP violation rather than statically
      # reading the built HTML). Both webServers are started and torn down by
      # Playwright itself; see apps/web/playwright.config.ts.
      - name: install chromium
        run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - name: playwright (smoke + csp)
        run: pnpm --filter @app/web exec playwright test

  openapi-current:
    name: openapi spec is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile

      # A drifted spec means the generated frontend client no longer matches the
      # server, which nobody notices until it is in front of the user.
      - name: regenerate and diff
        run: |
          pnpm run openapi
          git diff --exit-code -- packages/contracts/openapi/openapi.json

  gitleaks:
    name: gitleaks (secrets, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — gitleaks scans every reachable commit, not just HEAD

      # Run via the upstream image rather than a third-party wrapper action:
      # same rationale as pinning pnpm's own version above (D14) — one fewer
      # supply-chain edge. False positives get a fingerprint entry in
      # .gitleaksignore, reviewed, never a blanket rule relaxation.
      - name: gitleaks detect
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            detect --source . --redact --exit-code 1 -i .gitleaksignore

  license-gate:
    name: license gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile

      # Fails on: a deny-listed license or package name (licenses.policy.yaml),
      # or UNKNOWN/unparseable anywhere (D15, 06 §5.4). Also regenerates
      # THIRD_PARTY.md — the diff check below is what makes "generated,
      # committed, CI fails on drift" (06 §7.2) actually true rather than
      # aspirational.
      - name: run the license gate
        run: node scripts/check-licenses.ts
      - name: THIRD_PARTY.md is current
        run: git diff --exit-code -- THIRD_PARTY.md

  compose-hardening:
    name: compose hardening (P0-6/P0-7, parsed not grepped)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two steps, and the order matters. The gate checks itself against a
      # deliberately hostile fixture first: the grep this replaced passed a
      # privileged, host-networked, Docker-socket-mounting service with
      # EXIT=0 for a month (H-1), so "the check ran and said PASS" is not
      # evidence unless the check has been observed failing something.
      - name: the gate catches a hostile compose file
        run: bash scripts/compose-hardening-check.sh --self-test

      # D-4 (gate-security-review.md §8.2 N-1, §8.11 D-4): the computed
      # ownership/mode check for every secret compose.yml mounts on a
      # service, styled after — and run right after — the check above. CI
      # has no real ./secrets (every file secret is absent), so the "real"
      # run below finds nothing to check and passes trivially; --self-test
      # is what actually exercises it here, against a synthetic fixture that
      # needs no root.
      - name: the secret-ownership gate catches a mismatched owner/mode
        run: bash scripts/check-secret-ownership.sh --self-test

      - name: every mounted secret that exists is owned for its consumer(s)
        run: bash scripts/check-secret-ownership.sh

      - name: every compose file meets the P0-6/P0-7 baseline
        run: bash scripts/compose-hardening-check.sh

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .trivyignore has no expired suppressions
        run: |
          today="$(date -u +%Y-%m-%d)"
          expired=0
          while IFS= read -r line; do
            [[ "$line" =~ \#\#[[:space:]]*expires:[[:space:]]*([0-9]{4}-[0-9]{2}-[0-9]{2}) ]] || continue
            expiry="${BASH_REMATCH[1]}"
            if [[ "$expiry" < "$today" ]]; then
              echo "::error::.trivyignore entry expired on $expiry: $line"
              expired=1
            fi
          done < .trivyignore
          exit "$expired"

      - name: trivy fs (deps + secrets + misconfig)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
              --skip-dirs node_modules --ignorefile /repo/.trivyignore --exit-code 1 /repo

  docker-build-scan:
    name: docker build + trivy image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
            context: .
          - image: backup
            dockerfile: docker/backup.Dockerfile
            context: docker
          - image: proxy
            dockerfile: docker/caddy.Dockerfile
            # Repo root: this image builds apps/web and serves dist/ (see
            # docker/caddy.Dockerfile's web-build stage).
            context: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only actually used by the api-image gate-image-closure step below
      # (C-1c) — kept at job scope, not step scope, since actions/setup-node
      # is cheap and every other matrix entry just skips the step that needs it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single-arch (the runner's own arch), loaded into the local docker
      # daemon so trivy/syft below can scan it directly. release.yml does the
      # real multi-arch, pushed, signed build; this build exists to scan.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: personalfi/${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}

      - name: trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /repo/.trivyignore --exit-code 1 \
              personalfi/${{ matrix.image }}:ci

      # D14/D15: Vite's MPL-2.0 lightningcss is a devDependency of apps/web and
      # must never reach the runtime image — see docker/api.Dockerfile's
      # header for the `pnpm install --filter-prod=@app/api... --prod`
      # mechanism that is supposed to keep it out. This is the check that
      # proves it, not just asserts it.
      - name: assert lightningcss (MPL-2.0, dev-only) is absent from the api image
        if: matrix.image == 'api'
        run: |
          if docker run --rm --entrypoint sh personalfi/api:ci -c \
              "find / -xdev -iname '*lightningcss*' 2>/dev/null" | grep -q .; then
            echo "::error::lightningcss found in the api runtime image — a dev-only MPL-2.0 dependency leaked in"
            exit 1
          fi
          echo "lightningcss: absent (verified)"

      # gate-security-review.md F-1/C-1c: F-1 was "the api image hadn't booted
      # since WP 1.2" — a Dockerfile prune step deleted a package the runtime
      # needed, and nothing in `just check`, `just verify`, or CI ever started
      # the built image, so a restart-looping container shipped clean through
      # every gate but the one that actually ran `docker compose up`.
      # `apps/api/test/gate-image-closure.test.ts` is the regression test (it
      # asks pnpm for @app/api's production closure, asserts every project in
      # it survived the prune, then imports the composition root *inside* the
      # image); it self-skips whenever `docker image inspect` can't find its
      # target, which up to now was always, in every job. This is that image,
      # named exactly as the test's `PERSONALFI_API_IMAGE` override expects.
      - name: gate-image-closure (api image actually boots)
        if: matrix.image == 'api'
        env:
          PERSONALFI_API_IMAGE: personalfi/api:ci
        run: |
          npm install --global pnpm@12.4.1
          pnpm install --frozen-lockfile
          pnpm exec vitest run apps/api/test/gate-image-closure.test.ts

      - name: sbom (syft, SPDX + CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}/sbom:/out" \
            anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            "personalfi/${{ matrix.image }}:ci" \
            -o "spdx-json=/out/${{ matrix.image }}.spdx.json" \
            -o "cyclonedx-json=/out/${{ matrix.image }}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom/
          retention-days: 90
