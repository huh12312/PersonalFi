# SPDX-License-Identifier: MIT
#
# The unattended-upgrade test (WP 9.4; docs/plan/09-phase-9-dispatch.md §3,
# v1.0's "unattended upgrade from v0.1 works"): v0.1 (d04669e) installed cold
# and loaded through its own API, then the DIRECT JUMP to this commit by
# `just upgrade` alone, with checks (i)–(vi) and the cross-boundary restore.
#
# Not here, and why:
#   * the chain (W0 -> W1 -> … -> HEAD) runs locally at each gate
#     (`bash scripts/upgrade-test/run.sh --path chain`): seven image sets do
#     not fit a runner's time budget;
#   * the stack-level CF-2 rollback suite (it builds HEAD+1, a sabotaged HEAD
#     and W5) runs locally too: `--ci` skips it, so this job builds exactly
#     two image sets, W0 and HEAD. CF-2 itself is covered on every push by
#     `packages/db/test/migrate-newer.test.ts` (ci.yml's `db` project).
#
# Self-contained: nothing here reads a developer's /tmp state. `WORK` is the
# runner's temp directory; the compose project is pf-upgrade-direct on
# 127.0.0.1:8451/8452; images are tagged pf-upgrade/<svc>:<sha>.
#
# The weekly run is also the no-cache image build plus `trivy image` on its
# output (WP 9.11, G-22: the apk pin policy's detection half, and P2-9's
# running-image scan): see the step after the jump.
#
# Triggers: by hand, weekly, and as a required predecessor of release.yml —
# release.yml calls this workflow (`workflow_call`) and its build job
# `needs:` it, so a tag whose direct jump is red never publishes an image.
name: Upgrade test

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC — off the hour, after the weekend's dependency PRs.
    - cron: '17 6 * * 1'
  workflow_call:

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  direct-jump:
    name: v0.1 -> this commit, by `just upgrade` alone
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Job-level, not workflow-level: the same group whether this runs on its
    # own triggers or inside release.yml through `workflow_call`. Two runs on
    # one ref never share a runner's ports anyway; this only queues them.
    concurrency:
      group: upgrade-test-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `git archive d04669e` needs the history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10
      # The driver runs passkey ceremonies in the repo's own Playwright Chromium.
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
        timeout-minutes: 10
      - name: install just
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq just
          # `import` (the justfile pulls in scripts/upgrade-test/upgrade.just)
          # is stable from just 1.19; Ubuntu 24.04 ships 1.21.
          v="$(just --version | awk '{print $2}')"
          echo "just $v"
          printf '1.19.0\n%s\n' "$v" | sort -C -V || { echo "just $v is older than 1.19.0"; exit 1; }
      - name: the placeholder script's self-test
        timeout-minutes: 5
        run: bash scripts/secrets-placeholders.sh --self-test
      - name: direct jump W0 -> HEAD
        timeout-minutes: 60
        shell: bash
        env:
          WORK: ${{ runner.temp }}/wp94
        # Foreground under its own timeout. The full log is kept for the report
        # step; only step boundaries, timings and the verdict are echoed here.
        run: |
          mkdir -p "$WORK"
          set -o pipefail
          timeout 3500 bash scripts/upgrade-test/run.sh --path direct --ci --keep 2>&1 |
            tee "$WORK/direct.log" |
            grep --line-buffered -E 'step .*: (start|done)|timing|FATAL|FAILED|RESULT'
      # G-22 / F-94-8 / P2-9 (WP 9.11): the HEAD images above were just built on
      # a fresh runner with no layer cache — so the weekly run of this workflow
      # IS the weekly no-cache build (an expired apk build or a broken base
      # fails the jump), and this scans what it produced: the images exactly as
      # a clean host's `just upgrade` would build them today, not CI's
      # GHA-cached ones. Same trivy pin and policy as ci.yml's image job.
      - name: trivy image (the freshly built HEAD images)
        if: always()
        timeout-minutes: 15
        run: |
          tag="$(git rev-parse --short=7 HEAD)-wp94"
          scanned=0
          for svc in api backup proxy; do
            img="pf-upgrade/${svc}:${tag}"
            if ! docker image inspect "$img" >/dev/null 2>&1; then
              echo "::warning::$img was not built (the jump failed before HEAD's build); not scanned"
              continue
            fi
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}:/repo" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /repo/.trivyignore --exit-code 1 \
                "$img"
            scanned=$((scanned + 1))
          done
          echo "trivy image: ${scanned}/3 HEAD image(s) scanned"
      - name: report
        if: always()
        timeout-minutes: 2
        env:
          WORK: ${{ runner.temp }}/wp94
        # Every per-step log, not only the driver's: a `FATAL: W0 build failed
        # (see …/w0-build.log)` is unreadable on a runner otherwise (the first
        # runner run, 2026-10-06). The logs hold build and compose output; the
        # test-only secrets live under install/secrets and are never printed.
        run: |
          cat "$WORK/runs/direct/report.md" >> "$GITHUB_STEP_SUMMARY" || true
          tail -60 "$WORK/direct.log" || true
          for f in "$WORK"/runs/direct/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f") (last 120 lines)"
            tail -120 "$f"
            echo "::endgroup::"
          done
      - name: teardown
        if: always()
        timeout-minutes: 5
        env:
          WORK: ${{ runner.temp }}/wp94
        run: bash scripts/upgrade-test/run.sh --path direct --teardown || true
