# SPDX-License-Identifier: MIT
#
# Tag-triggered release (06 §5.1 job 12, §5.2, §5.3). Runs only on `vX.Y.Z`
# tags, after `ci.yml` has already passed on the commit being tagged — this
# workflow does not repeat typecheck/lint/test/vuln-scan; it builds the
# real multi-arch artifact, signs it, and publishes it.
#
# Two independent attestations, on purpose (06 §5.3):
#   - `actions/attest-build-provenance` -> SLSA provenance in GitHub's
#     attestation store, verified with `gh attestation verify`.
#   - `cosign sign --yes` keyless (OIDC -> Fulcio -> Rekor) -> verifiable by
#     anyone with cosign and no GitHub account.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  build-sign-publish:
    name: build, sign, publish (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless OIDC + attest-build-provenance
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
            context: .
          - image: backup
            dockerfile: docker/backup.Dockerfile
            context: docker
          - image: proxy
            dockerfile: docker/caddy.Dockerfile
            context: docker
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          repo_owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_base=ghcr.io/${repo_owner_lower}/personalfi-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # linux/arm64 for the api image runs under QEMU (Node build-base compiles
      # a native dep or two) and is materially slower than amd64 — 06 §5.2
      # flags this as the point to split into a native-arm64-runner matrix if
      # it ever crosses ~10 minutes. Not split yet: this is WP 0.4's first
      # release build, and it has not been measured against that threshold.
      - name: build and push (multi-arch)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:${{ steps.version.outputs.value }}
            ${{ steps.meta.outputs.image_base }}:latest
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image_base }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: cosign sign (keyless)
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign --yes "${{ steps.meta.outputs.image_base }}@${{ steps.build.outputs.digest }}"

      - name: sbom (syft, uploaded as a release artifact)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "${{ github.workspace }}/sbom:/out" \
            anchore/syft:v1.51.1@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            "${{ steps.meta.outputs.image_base }}@${{ steps.build.outputs.digest }}" \
            -o "spdx-json=/out/${{ matrix.image }}-${{ steps.version.outputs.value }}.spdx.json" \
            -o "cyclonedx-json=/out/${{ matrix.image }}-${{ steps.version.outputs.value }}.cdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.image }}
          path: sbom/
          retention-days: 365

  github-release:
    name: publish GitHub release
    needs: build-sign-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sbom-*
          path: sbom
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: sbom/*
