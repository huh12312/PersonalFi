# SPDX-License-Identifier: MIT
#
# Adversarial fixture for scripts/compose-hardening-check.sh. NEVER deployed,
# never discovered by the gate's normal file sweep (scripts/fixtures is pruned),
# and never referenced by any `docker compose` invocation outside `--self-test`.
#
# Every service below violates a specific rule the gate must catch. The gate's
# `--self-test` mode asserts that *each* rule id in EXPECTED_RULES fires against
# this file — so deleting or weakening a check makes the self-test fail, which
# is the property H-1 found missing: the old grep passed a maximally hostile
# service and nobody noticed.
#
# Keep one violation class per service where compose's own schema allows it
# (`network_mode: host` cannot coexist with `ports:` or `networks:`, so the
# host-namespace service and the port-binding service have to be separate).

name: personalfi-hostile-fixture

services:
  # host namespaces + privileged + the Docker socket, all at once.
  hostile-namespaces:
    image: alpine:3.24
    privileged: 'true' # quoted: the spelling the old regex missed
    network_mode: host
    pid: host
    ipc: host
    userns_mode: host
    command: ['sleep', 'infinity']
    volumes:
      - /run/docker.sock:/var/run/docker.sock:ro # ro, and still never allowed

  # capabilities, seccomp/apparmor, devices, and a writable host bind.
  hostile-capabilities:
    image: alpine:3.24
    cgroup: host
    cap_add: [SYS_ADMIN, NET_ADMIN]
    security_opt:
      - 'seccomp:unconfined'
      - 'apparmor:unconfined'
    devices:
      - '/dev/kmsg:/dev/kmsg'
    command: ['sleep', 'infinity']
    volumes:
      - /:/host:rw
      - /run/podman/podman.sock:/podman.sock:ro
      - /proc:/host-proc:ro # sensitive host path, read-only: still lets it walk host procfs
      # gate-security-review-3.md R-7: read-only binds of the newly-added
      # sensitive prefixes must still trip sensitive-host-path-bind-mount,
      # not just the original five.
      - /etc:/host-etc:ro
      - /root:/host-root:ro
      - /home:/host-home:ro
      - /boot:/host-boot:ro
      - /var/lib/docker:/host-docker:ro

  # published ports with no explicit host address, plus every positive control
  # missing: no read_only, no cap_drop, no no-new-privileges, root user.
  hostile-ports:
    image: alpine:3.24
    user: '0:0'
    command: ['sleep', 'infinity']
    ports:
      - '443:8443' # bare mapping: binds every interface
      - '0.0.0.0:80:8080' # explicit wildcard
      - '[::]:8081:8081' # the IPv6 spelling of the same mistake
    volumes:
      - scratch:/scratch # writable named volume outside the documented set
      - pgdata:/stolen-pgdata # documented volume, wrong (non-owning) service

  # WP 5.2 — the local-model sandbox, broken every way the gate refuses.
  # The runtime: on `backend` as well as `llm` (reaches db), publishing its
  # port (explicit bind address, so only the ollama rule fires, not
  # port-bind-address), running as root, mounting a secret, a floating tag,
  # debug logging (prompt content in the host's logs), no limits, no
  # healthcheck, no profile (starts on every `up`), and the model store
  # writable (the runtime could rewrite the weights it serves next).
  ollama:
    image: ollama/ollama:latest
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend, llm]
    ports:
      - '127.0.0.1:11434:11434'
    secrets: [hostile_secret]
    environment:
      OLLAMA_DEBUG: '1'
    volumes:
      - ollama_models:/var/tmp

  # `api` has no business on `llm`: it runs no local model.
  hostile-api-on-llm:
    image: alpine:3.24
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['sleep', 'infinity']
    networks: [llm]

  # The pull: in the runtime's profile as well as its own (so a plain
  # `--profile local-llm up` would reach the internet), and on a network it
  # shares with another service.
  ollama-pull:
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    profiles: ['local-llm', 'local-llm-pull']
    user: '10003:10003'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [llm-pull]
    deploy:
      resources: { limits: { cpus: '1.0', memory: 1G, pids: 256 } }

  hostile-pull-peer:
    image: alpine:3.24
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['sleep', 'infinity']
    networks: [llm-pull]

  # WP 9.4 (CF-3) — the pre-migration backup, broken every way the gate
  # refuses: root, a writable rootfs, an added capability, no cap_drop, no
  # no-new-privileges, and a writable mount of a volume it does not own.
  pre-migrate-backup:
    image: alpine:3.24
    user: '0:0'
    read_only: false
    cap_add: [DAC_OVERRIDE]
    command: ['true']
    volumes:
      - pgdata:/stolen-pgdata-too

  # ... and a migrator that waits only for it to START, so a failed or
  # half-written backup would be raced by the first migration.
  migrator:
    image: alpine:3.24
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: ['true']
    depends_on:
      pre-migrate-backup: { condition: service_started }

networks:
  backend: {}
  # Not internal: the model's network would route off the host.
  llm: {}
  llm-pull: {}

secrets:
  hostile_secret:
    file: ./hostile-secret-never-created

volumes:
  scratch: {}
  pgdata: {}
  ollama_models: {}
