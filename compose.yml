# SPDX-License-Identifier: MIT
#
# Production stack (WP 0.4; master plan D12-D15, D24, §4 security baseline).
#
#   docker compose up -d                       -> proxy, api, worker, migrator, db, backup
#   docker compose --profile sidecar up -d     -> + placeholder sidecar scaffold (Phase 6)
#   docker compose --profile local-llm up -d   -> + ollama, the local model runtime (WP 5.2; RUNBOOK "Local model")
#   docker compose --profile local-llm-pull run --rm ollama-pull  -> the one-shot model pull (WP 5.2)
#   docker compose --profile webhooks up -d    -> + placeholder webhook listener scaffold
#
# `compose.dev.yml` is the *other* file (dev-only Postgres). This file is never
# layered on top of it and never the other way around — see that file's header.
#
# Network topology (memo 06 §2.1's four, plus WP 5.2's two — `llm` and
# `llm-pull`, described at the `networks:` block below):
#   frontend  bridge            proxy <-> api only.
#   backend   bridge            api, worker, db, migrator, backup. Carries both
#                                internal DB traffic and each service's own
#                                outbound HTTPS (Plaid, Coinbase, Tiingo, B2, ...).
#   sidecar   internal: true    placeholder services only right now. `db` never
#                                joins it, so P0-8 ("sidecar cannot resolve or
#                                reach db") holds structurally, by construction,
#                                regardless of what `backend` allows.
#   ingress   bridge            the future webhook listener, alone. It was on
#                                `backend` until the Phase 0 gate (M-5) pointed
#                                out that the one placeholder destined to face
#                                the internet had a direct route to Postgres.
#
# Only `proxy` publishes a port, and only to `${BIND_ADDRESS}` (default
# 127.0.0.1 — see .env.example). `scripts/compose-hardening-check.sh` asserts
# that — and the rest of P0-6/P0-7 — against `docker compose config --format
# json` rather than against the raw text, on every compose file in the repo, in
# CI (`compose-hardening`), in `just verify`, and in the pre-commit hook. It
# checks itself against a deliberately hostile fixture first
# (`--self-test`), because the grep it replaced passed one.

x-common: &common
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }
  environment:
    TZ: UTC

x-app-image: &app-image
  image: ${REGISTRY:-personalfi}/api:${PERSONALFI_VERSION:-dev}
  build:
    context: .
    dockerfile: docker/api.Dockerfile

networks:
  frontend: {}
  backend: {}
  sidecar: { internal: true }
  # Phase 6/D12's future webhook listener and nothing else. Separate from
  # `backend` (no route to db, api, worker) and from `frontend` (no route to
  # the proxy), and NOT `internal: true` because the one service that will
  # ever live here is by definition reachable from outside.
  ingress: {}
  # WP 5.2: the local model's network. `ollama` and `worker` only (the
  # hardening check refuses any third member), `internal: true`, so nothing on
  # it has a route off the host. `db` is not on it.
  llm: { internal: true }
  # WP 5.2: `ollama-pull`'s network, and only its. Not internal — the pull
  # must reach registry.ollama.ai — and joined by nothing else, so the one
  # container with internet access shares a network with no other service.
  llm-pull: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  backups: {}
  # WP 4.5/4.6 (WP 4.12b, the Wave C wiring handover §4.4): `worker`'s cache
  # for the pinned, checksum-verified return series. See that service's own
  # comment above.
  returns_cache: {}
  # WP 5.2: the pulled model store. Written only by the one-shot
  # `ollama-pull`; mounted read-only by `ollama`. See that service's comment.
  ollama_models: {}

secrets:
  # FILE MODE (M-2). There is deliberately no `mode: 0400` here. Compose's
  # file-secret provider bind-mounts the host file and preserves its uid/gid
  # and mode verbatim; `uid`/`gid`/`mode` in the long syntax are Swarm-only and
  # are silently ignored by `docker compose up`. Measured on Compose v5.5.1
  # with a 0644 host file, `mode: 0400`, `uid/gid: 10001` and a container
  # running as 10001: `-rw-r--r-- 1 1000 1000 /run/secrets/s`, i.e. nothing
  # applied. Declaring 0400 here would therefore be a comforting lie, not a
  # control. The enforced posture instead is:
  #   * `${SECRETS_DIR}` itself is 0700 (only the operator and root can
  #     traverse into it) — `just gen-pg-secrets`/`gen-master-key` set and
  #     verify that;
  #   * the files inside it are 0444 by default, because db (uid 70),
  #     api/worker/migrator (10001) and backup (10002) all read from the same
  #     host directory and a 0400 file owned by the operator is unreadable in
  #     every one of them;
  #   * `just harden-secrets` is the real 0400: it chowns each file to the
  #     consuming service's uid and chmods 0400, which *does* pass through, at
  #     the cost of one `sudo`. RUNBOOK.md "Create secrets" documents both.
  #
  # No `.txt` extensions: Docker mounts each of these at `/run/secrets/<name
  # declared here>` regardless of the source filename on the host, but the
  # *host-side* filename is not free to pick independently — it has to match
  # what `.env.example` documents and what `just gen-master-key` (WP 0.2)
  # actually writes, both of which are extension-less (`${SECRETS_DIR}/
  # database_url`, `${SECRETS_DIR}/master_key`). Matching that here, rather
  # than inventing a second, `.txt`-suffixed convention, is what makes
  # "write a high-entropy passphrase to ${SECRETS_DIR}/master_key" in
  # packages/config/src/schema.ts's own hint text literally true.
  #
  # Read by @core/config (packages/config/src/schema.ts SECRET_SPECS): the
  # full `postgres://...` connection string, consumed by api, worker, and
  # migrator alike — they all call the same `loadConfig()`.
  database_url:
    file: ./secrets/database_url
  # Postgres's own bootstrap credential. Not one of the four secret names the
  # WP 0.4 brief lists (database_url, master_key, age_recipient, b2_*) — added
  # because `postgres:18.6-alpine3.24`'s own entrypoint and the backup/restore
  # scripts need a bare password, not a full connection URL, and compose has
  # no way to derive one from the other at declaration time. Documented
  # deviation, not an oversight.
  pg_password:
    file: ./secrets/pg_password
  # WP 0.2 wires KEK custody (D5) and consumes this in apps/api; `just
  # gen-master-key` writes it. Declared and mounted here so that work package
  # touches no compose file.
  master_key:
    file: ./secrets/master_key
  # age *recipient* (public key) only — see docker/backup/backup.sh header for
  # why the backup container never holds the matching private key.
  age_recipient:
    file: ./secrets/age_recipient
  # Optional: only read by backup.sh when RCLONE_REMOTE is set. Placeholder
  # files are fine (and the default) when B2 push is not in use.
  b2_key_id:
    file: ./secrets/b2_key_id
  b2_application_key:
    file: ./secrets/b2_application_key
  # Optional, file-only (01 §1.10: never published or shared) — C-3,
  # gate-security-review.md §2.2 F-2. Attached to `api` and `worker` only
  # (`@core/config`'s `loadConfig()`), never to `proxy` (a static file server
  # and reverse proxy has no use for a Plaid credential) or `backup` (a `pg_dump`
  # process has no use for one either — the ciphertext it dumps is already
  # sealed under the KEK, not under these). Compose requires every declared
  # secret's host file to exist before `docker compose up` will start a
  # container that mounts it — there is no "optional bind mount" in Compose's
  # secret model — so `RUNBOOK.md` "Create secrets" has the operator generate
  # these three **empty** when Plaid is not in use. `packages/config/src/load.ts`
  # treats a zero-length (or whitespace-only) secret file exactly as it treats
  # a missing one (tested: `packages/config/src/load.test.ts` "treats a
  # zero-length secret file as absent"), so an empty placeholder is
  # indistinguishable from no file at all to `@core/config` — Plaid simply
  # is not registered, the same as before this file existed.
  plaid_client_id:
    file: ./secrets/plaid_client_id
  plaid_secret:
    file: ./secrets/plaid_secret
  # `sandbox` | `production`, as text — not required to exist with content;
  # see `resolvePlaid` (packages/config/src/load.ts), which defaults to
  # `sandbox` when this file is absent or empty but credentials are present.
  plaid_env:
    file: ./secrets/plaid_env
  # Optional, file-only (wp2.6-insights.md §6 open item 5; docs/evidence/
  # phase-2/wp2.w-wiring.md). `@ctx/insights` keys every merchant pseudonym it
  # hands an advisor from this value, mixed with the user id — rotating it
  # re-pseudonymises every merchant and orphans every `MERCHANT_…` reference
  # an evidence row already stored, so (like `master_key`) it is never an env
  # var and never has a fallback derived from another secret. Attached to
  # `api` and `worker` only, same posture as the `plaid_*` secrets above —
  # neither `proxy` nor `backup` has any use for it. `packages/config/src/
  # load.ts` treats a zero-length file exactly as absent, so an empty
  # placeholder (RUNBOOK.md "Create secrets" step 7) boots identically to no
  # file at all: `module.insights` registers no consumer, no job and no
  # schedule until an operator writes a real value here.
  advisor_token_secret:
    file: ./secrets/advisor_token_secret
  # --------------------------------------------------------------- market data
  #
  # WP 3.4's four provider API keys (docs/evidence/phase-3/wp3.4-market-data.md
  # §6 and §9 item 1; docs/evidence/phase-3/wp3.w-wiring.md). File-only for the
  # same reason as the `plaid_*` pair above — 01 §1.10 / D5, an env var is
  # readable by every dependency in-process and survives into `docker inspect`,
  # `/proc/<pid>/environ`, child processes and crash dumps — and a third-party
  # API key is a credential whether or not it can move money.
  #
  # Attached to `api` and `worker` only. **`migrator` must not receive them**:
  # it applies DDL, has no `PriceSource` and will never dial a provider, so
  # handing it four credentials would widen their blast radius to a one-shot
  # container for nothing. `proxy` and `backup` are out for the same reason
  # they are out of the `plaid_*` list.
  #
  # All four are optional in the strong sense: every adapter answers
  # `skipped_no_key` without its key and the app boots normally (03 §6 —
  # "Phase 3 completes with zero keys — it just cannot prove freshness").
  # Compose has no optional-secret model, so RUNBOOK.md has the operator create
  # these **empty**; `packages/config/src/load.ts` treats a zero-length file
  # exactly as a missing one, so an empty placeholder is indistinguishable from
  # no file at all to `@core/config`.
  tiingo_api_key:
    file: ./secrets/tiingo_api_key
  # FRED has no header auth, so this key necessarily travels in the query
  # string of every request. `@ctx/integrations` redacts every provider-authored
  # string before it is logged or stored in `market_data_runs` for exactly that
  # reason (wp3.4-market-data.md §6).
  fred_api_key:
    file: ./secrets/fred_api_key
  coingecko_api_key:
    file: ./secrets/coingecko_api_key
  openfigi_api_key:
    file: ./secrets/openfigi_api_key
  # ------------------------------------------------------------------ coinbase
  #
  # WP 3.5's CDP credential pair (docs/evidence/phase-3/wp3.5-coinbase.md §8.1).
  # `coinbase_key_name` is the JWT's `kid` and `sub`; `coinbase_private_key` is
  # the **Ed25519** signing key (EdDSA — ES256 is Plaid's *webhook* algorithm,
  # and 01 §3.2 warns against cargo-culting between the two).
  #
  # Same api+worker-only posture, and the same optional-means-empty-placeholder
  # convention: with neither present the connector is not registered at all, so
  # an install that does not use Coinbase boots exactly as it did before.
  coinbase_key_name:
    file: ./secrets/coinbase_key_name
  coinbase_private_key:
    file: ./secrets/coinbase_private_key
  # ----------------------------------------------------------------- walletrpc
  #
  # WP 3.6's Etherscan v2 key (docs/evidence/phase-3/wp3.6-walletrpc.md §8
  # item 2). Same api+worker-only posture and the same empty-placeholder
  # convention, but optional in a stronger sense than any secret above it: the
  # watch-only wallet connector is registered either way, and its Bitcoin leg —
  # local xpub/ypub/zpub derivation against Blockstream Esplora — needs no key
  # at all. Only the Ethereum leg does, because Etherscan v2 requires one even
  # at the free tier, and `@connector/walletrpc` refuses **by name**
  # (`CONFIG_ERROR`, naming this file) rather than dialling without it.
  etherscan_api_key:
    file: ./secrets/etherscan_api_key

services:
  proxy:
    <<: *common
    image: ${REGISTRY:-personalfi}/proxy:${PERSONALFI_VERSION:-dev}
    build:
      # Repo root, not `docker/`: this image builds and serves apps/web (see
      # docker/caddy.Dockerfile's `web-build` stage). .dockerignore keeps
      # node_modules, secrets, and any host-built dist out of the context.
      context: .
      dockerfile: docker/caddy.Dockerfile
    networks: [frontend]
    ports:
      # LAN/Tailscale bind address only, never 0.0.0.0 (see .env.example).
      # Caddy listens on unprivileged container ports 8443/8080 internally
      # (see docker/Caddyfile header) specifically so this service needs no
      # NET_BIND_SERVICE capability and can keep cap_drop: [ALL] with zero
      # exceptions — a deliberate change from memo 06 §2.5's sketch, which
      # mapped host 443/80 straight onto container 443/80.
      - '${BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTPS_PORT:-443}:8443'
      - '${BIND_ADDRESS:-127.0.0.1}:${PROXY_HTTP_PORT:-80}:8080'
    environment:
      TZ: UTC
      # One name for one fact (was PERSONALFI_HOSTNAME): this is the hostname
      # the browser uses, and therefore simultaneously Caddy's site address,
      # the API's BASE_URL, the WebAuthn RP id, and the CSRF origin allow-list.
      # They were allowed to disagree once (P0-4) and nothing announced it.
      PUBLIC_HOST: ${PUBLIC_HOST:-personalfi.lan}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-chris@thebrutus.org}
      # C-3, gate-security-review.md §2.2 F-2/§2.3 F-3/§6 C-2: `docker/Caddyfile`
      # reads this to decide whether to widen its CSP for `cdn.plaid.com` /
      # `sandbox.plaid.com` / `production.plaid.com` — a deployment with no
      # Plaid secrets keeps the narrower default policy. This service has no
      # way to read `secrets/plaid_client_id` itself (it never mounts Plaid
      # secrets — see the `secrets:` block above), so the operator states the
      # fact here rather than Caddy inferring it. See `.env.example` for how
      # to set it, and keep it in agreement with whether `secrets/plaid_client_id`
      # and `secrets/plaid_secret` actually have content.
      PLAID_ENABLED: ${PLAID_ENABLED:-false}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      # Caddy's admin-API autosave state (admin is off, but the on-disk config
      # snapshot it writes on load is not) lives under /config/caddy; keeping
      # the parent /config read-only and only this one subdirectory writable
      # keeps read_only:true above meaningful rather than nominal.
      - /config/caddy:size=16m
    # docker/caddy.Dockerfile builds a non-root, capability-stripped image
    # specifically so this can be true (see that file's header for the
    # cap_drop+no-new-privileges+file-capability conflict it fixes) — verified
    # by booting this exact image with these exact flags during WP 0.4.
    user: '10003:10003'
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources: { limits: { cpus: '0.50', memory: 128M } }

  api:
    <<: [*common, *app-image]
    environment:
      TZ: UTC
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: '8080'
      BASE_URL: https://${PUBLIC_HOST:-personalfi.lan}
      # P0-4. These were unset, so the container booted with the shipped
      # development defaults (`localhost` / `http://localhost:8080`) while
      # serving `https://personalfi.lan`: every mutation was rejected as
      # cross-site with `403 csrf_failed`, and `localhost` is not a registrable
      # suffix of `personalfi.lan`, so the browser refused the WebAuthn
      # ceremony before the server was ever consulted. Nobody had ever logged
      # in and nothing said so.
      #
      # AUTH_RP_ID is the hostname with no scheme and no port. Changing it
      # later invalidates every enrolled passkey, so it is the same
      # `PUBLIC_HOST` the proxy serves and BASE_URL above states.
      AUTH_RP_ID: ${PUBLIC_HOST:-personalfi.lan}
      # EXTRA_ALLOWED_ORIGINS (optional, comma-separated) is appended for a
      # second origin on the SAME registrable name — a different port, or a
      # subdomain. It is NOT a way to add a Tailscale MagicDNS name: WebAuthn
      # §7.1 requires every allowed origin's host to equal AUTH_RP_ID or be a
      # subdomain of it, and `@core/config` enforces exactly that at boot, so
      # `<node>.<tailnet>.ts.net` alongside `personalfi.lan` fails to start by
      # design. Pick one hostname for passkeys; see RUNBOOK.md "Enabling
      # remote access".
      AUTH_ALLOWED_ORIGINS: https://${PUBLIC_HOST:-personalfi.lan}${EXTRA_ALLOWED_ORIGINS:+,${EXTRA_ALLOWED_ORIGINS}}
      SECRETS_DIR: /run/secrets
      ROLE: api
      # Non-secret Plaid deployment shape (packages/config/src/schema.ts) — the
      # credentials themselves are the three `plaid_*` file secrets below, never
      # an env var (01 §1.10). Empty/unset is fine: `PLAID_REDIRECT_URI` defaults
      # to `null` (OAuth institutions disabled) and `@core/config` refuses to
      # boot if it is set but is not https or does not share an origin with
      # AUTH_ALLOWED_ORIGINS (C-3). Mirrors `PLAID_ENABLED` on `proxy`, above —
      # keep the two in agreement; see `.env.example`.
      PLAID_ENABLED: ${PLAID_ENABLED:-false}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}
      # WP 3.4's four market-data keys and WP 3.5's CDP pair join the list here
      # and on `worker` — and on neither `migrator` nor `proxy` nor `backup`.
      # Kept in step with `just harden-secrets`, in the same edit (N-1).
      #
      # `age_recipient` joins the list here too (WP 4.12b, C-5; G3-4): `GET
      # /export?encrypt=true` runs in this container
      # (`apps/api/src/routes/export.ts`), and `encryptWithAge` reads the
      # recipients file from `SECRETS_DIR` directly — it is the same *public*
      # key the `backup` service already holds below, read-only, never the
      # matching identity (private key), which never exists in this compose
      # file at all (RUNBOOK.md's "Export and import").
      # Phase 4 gate C-1 (G4-1, HIGH): the interactive projection route
      # (`app.ts`'s `createMonteCarloRunnerFromCache`) reads the same series
      # the worker fetches, so `api` needs the same path — read-only, below.
      # Without it every `POST …/projections {"method":"monte_carlo"}` on a
      # compose install was bound to `null` whatever an operator fetched.
      PLANNING_RETURNS_CACHE_DIR: /var/lib/personalfi/returns
      # 05-phase-5-dispatch.md §4 item 9: kill switch 1 of WP 5.1's
      # four-level advisor ladder. `api` gets only this one this batch — the
      # `LOCAL_MODEL_*` keys and `MONTE_CARLO_MAX_CONCURRENT` join `worker`'s
      # environment, below, because `worker` is the process that runs the
      # `local_model` advisor and the nightly Monte Carlo baseline; whether
      # `api`'s own interactive projection route also needs the concurrency
      # cap is for the wave that wires `config.planning.monteCarloMaxConcurrent`
      # into `apps/api/src/domain.ts` to decide (05 §4 item 4, W-B), not this
      # shared-file batch.
      ADVISORS_ENABLED: ${ADVISORS_ENABLED:-true}
    secrets:
      [
        database_url,
        master_key,
        plaid_client_id,
        plaid_secret,
        plaid_env,
        advisor_token_secret,
        tiingo_api_key,
        fred_api_key,
        coingecko_api_key,
        openfigi_api_key,
        coinbase_key_name,
        coinbase_private_key,
        etherscan_api_key,
        age_recipient,
      ]
    networks: [frontend, backend]
    tmpfs: ['/tmp:size=64m,mode=1777,noexec,nosuid,nodev']
    # Phase 4 gate C-1: the fetched return series, read-only — `worker` is
    # still the one writer (`scripts/compose-hardening-check.sh`'s
    # `WRITABLE_NAMED_VOLUMES`); `api` only ever reads what it fetched.
    volumes:
      - returns_cache:/var/lib/personalfi/returns:ro
    user: '10001:10001'
    depends_on:
      db: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      # /ready (not /health): this is what other services' depends_on should
      # wait on — DB reachable *and* migrations current, per
      # apps/api/src/routes/health.ts's own doc comment.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    deploy:
      # 1.5G, not 768M: deriving the KEK is Argon2id at m = 1 GiB (P0-2's floor,
      # and `KEK_ARGON2_FLOORS.production` refuses anything lower), so the
      # process transiently needs the 1 GiB Argon2 block plus the wasm heap and
      # Node's own footprint. At 768M the kernel OOM-killer took the container
      # at exit 137 the moment anything triggered `SecurityRuntime.initialise()`
      # — measured: 768M and 512M both exit 137 with no output, 1200M derives in
      # 6.7 s. Because `/auth/unlock-state` initialises lazily, that made an
      # unauthenticated GET a remote kill switch for the API. Found by the
      # Phase 0 security gate.
      #
      # NOTE for the 2 GB whole-stack RAM target (master plan §3.4): this is a
      # *limit*, not a reservation, and the 1 GiB is a boot-time spike rather
      # than steady state — but api and worker both derive the KEK, so a
      # simultaneous cold start peaks around 2.4 GiB. If that target is hard,
      # the lever is `KEK_ARGON2_MEMORY_KIB` + the production floor, not this
      # number; staggering the two derivations would also work.
      resources: { limits: { cpus: '2.0', memory: 1536M } }

  worker:
    <<: [*common, *app-image]
    environment:
      TZ: UTC
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Same values as api: `loadConfig()` validates them for every role, and a
      # worker that disagreed with the API about the RP id would mint step-up
      # challenges no browser would honour.
      AUTH_RP_ID: ${PUBLIC_HOST:-personalfi.lan}
      AUTH_ALLOWED_ORIGINS: https://${PUBLIC_HOST:-personalfi.lan}${EXTRA_ALLOWED_ORIGINS:+,${EXTRA_ALLOWED_ORIGINS}}
      SECRETS_DIR: /run/secrets
      ROLE: worker
      # See the identical block on `api`, above — the worker is what actually
      # runs a Plaid sync (`SyncOrchestrator`), so it needs the same three
      # secrets and the same non-secret shape, not just the credential.
      PLAID_ENABLED: ${PLAID_ENABLED:-false}
      PLAID_REDIRECT_URI: ${PLAID_REDIRECT_URI:-}
      # D-3 (gate-security-review.md §8.11, §8.5 N-6): named explicitly here,
      # not left to packages/config/src/schema.ts's own defaults, so the
      # healthcheck below reads the *exact same* numbers the job runner and
      # scheduler actually poll at. Two independent hardcoded copies of "5000"
      # and "30000" is precisely the hand-maintained-pair failure this
      # document has already found three times (the image prune's delete set,
      # harden-secrets' secret list, the Caddyfile's proxied prefixes) — this
      # is the fourth place it could happen and the one place in this file it
      # is avoided by construction: one env var, read by both.
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-5000}
      SCHEDULER_INTERVAL_MS: ${SCHEDULER_INTERVAL_MS:-30000}
      # WP 4.5/4.6, the Wave C wiring handover §4.3/§4.4: `worker` is the one
      # process with a job runner, so it is the one process that constructs
      # `createMonteCarloRunnerFromCache` for the nightly refresh and the one
      # process that needs this volume mounted read-write — `api` mounts the
      # same volume read-only for the interactive route (Phase 4 gate C-1;
      # the earlier "api binds no monteCarlo" here was wrong, `app.ts` always
      # did). Points at the
      # named volume below, not the package's own default cache directory
      # (inside the image, and this rootfs is read-only — `x-common` above).
      PLANNING_RETURNS_CACHE_DIR: /var/lib/personalfi/returns
      # 05-phase-5-dispatch.md §4 item 9. `worker` is the process that runs
      # the `local_model` advisor's `insights.run_local` lane and the nightly
      # Monte Carlo baseline, so it gets every new key this batch adds;
      # `api` gets only `ADVISORS_ENABLED`, above. Every default below
      # matches `packages/config/src/schema.ts`'s own — an operator who sets
      # nothing here gets exactly what `@core/config` would default to
      # anyway; this block only has to agree, never invent.
      ADVISORS_ENABLED: ${ADVISORS_ENABLED:-true}
      LOCAL_MODEL_ENDPOINT: ${LOCAL_MODEL_ENDPOINT:-}
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-}
      LOCAL_MODEL_DIGEST: ${LOCAL_MODEL_DIGEST:-}
      LOCAL_MODEL_TIMEOUT_MS: ${LOCAL_MODEL_TIMEOUT_MS:-180000}
      LOCAL_MODEL_ALLOW_REMOTE: ${LOCAL_MODEL_ALLOW_REMOTE:-false}
      MONTE_CARLO_MAX_CONCURRENT: ${MONTE_CARLO_MAX_CONCURRENT:-8}
    # WP 3.4's four market-data keys and WP 3.5's CDP pair join the list here
    # and on `worker` — and on neither `migrator` nor `proxy` nor `backup`.
    # Kept in step with `just harden-secrets`, in the same edit (N-1).
    secrets:
      [
        database_url,
        master_key,
        plaid_client_id,
        plaid_secret,
        plaid_env,
        advisor_token_secret,
        tiingo_api_key,
        fred_api_key,
        coingecko_api_key,
        openfigi_api_key,
        coinbase_key_name,
        coinbase_private_key,
        etherscan_api_key,
      ]
    # `llm` (WP 5.2): the worker runs the `insights.run_local` lane, so it is
    # the one service that reaches `ollama`. Internal, and worker listens on
    # no port, so `ollama` gains nothing by sharing it.
    networks: [backend, llm]
    tmpfs: ['/tmp:size=64m,mode=1777,noexec,nosuid,nodev']
    # WP 4.5/4.6 (WP 4.12b, the Wave C wiring handover §4.4): the only named,
    # writable volume this service mounts, and the only service that mounts
    # `returns_cache` writable (`scripts/compose-hardening-check.sh`'s
    # `WRITABLE_NAMED_VOLUMES` names `worker` as its one owner; `api` mounts
    # it `:ro` since the Phase 4 gate's C-1). An operator
    # fetches WP 4.5's pinned return series onto it once
    # (`packages/contexts/planning/data/returns/fetch.ts`); this batch never
    # fetches on the process's own behalf.
    volumes:
      - returns_cache:/var/lib/personalfi/returns
    user: '10001:10001'
    depends_on:
      db: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    healthcheck:
      # D-3 (gate-security-review.md §8.5 N-4/N-6): the old check was
      # `node -e 'process.exit(0)'` — it asserted the Node binary exists and
      # nothing else, and reported `healthy` through all 189 of N-4's silent
      # restarts, in which the consumer pump, job runner and scheduler never
      # started. `apps/api/src/worker.ts` now writes a heartbeat file under
      # `/tmp/liveness` (a tmpfs mount, so this works under `read_only: true`)
      # every time the job runner polls and every time the scheduler ticks.
      # This reads those files' timestamps and fails unless at least one of:
      #   (a) the worker is deliberately idle (no account holder enrolled yet
      #       — `idle.heartbeat` exists, is fresher than 3x JOB_POLL_INTERVAL_MS,
      #       and neither of the other two heartbeats exists),
      #   (b) both `job-runner.heartbeat` and `scheduler.heartbeat` exist and
      #       are each fresher than 3x their own poll interval.
      # A missing master_key or a locked keyring falls into neither bucket —
      # deliberately: "syncs will not run" was previously silent, and now
      # surfaces as unhealthy exactly as a dead job runner does. Nothing in
      # this compose file depends_on worker's health, so this only affects
      # `docker compose ps` / `docker inspect` visibility, not startup ordering.
      #
      # The idle bucket's own freshness check is not incidental: the first
      # cut of this check only asked "does idle.heartbeat exist", and a
      # kill -STOP of a worker that had already reached idle (a freshly
      # migrated database, before the first passkey is enrolled — the state
      # every real deployment starts in) reported `healthy` forever off the
      # one heartbeat written at boot, exactly the failure D-3 exists to
      # close. `apps/api/src/worker.ts` now re-touches `idle.heartbeat` on
      # the job runner's own poll cadence for as long as it stays idle, so
      # this can hold it to the same staleness bar as the other two.
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('node:fs');const dir='/tmp/liveness';const now=Date.now();const jobMax=(Number(process.env.JOB_POLL_INTERVAL_MS)||5000)*3;const schedMax=(Number(process.env.SCHEDULER_INTERVAL_MS)||30000)*3;const age=(n)=>{try{return now-Number(fs.readFileSync(dir+'/'+n+'.heartbeat','utf8'));}catch{return null;}};const idleAge=age('idle');const jobAge=age('job-runner');const schedAge=age('scheduler');if(idleAge!==null&&jobAge===null&&schedAge===null){if(idleAge>jobMax){process.stderr.write('idle heartbeat missing or stale (age='+idleAge+'ms max='+jobMax+'ms)\\n');process.exit(1);}process.exit(0);}if(jobAge===null||jobAge>jobMax){process.stderr.write('job-runner heartbeat missing or stale (age='+jobAge+'ms max='+jobMax+'ms)\\n');process.exit(1);}if(schedAge===null||schedAge>schedMax){process.stderr.write('scheduler heartbeat missing or stale (age='+schedAge+'ms max='+schedMax+'ms)\\n');process.exit(1);}process.exit(0);",
        ]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      # 512M, not 1536M. The Phase 0 gate raised both api and worker to 1536M
      # on the assumption that both derive the KEK; only the api does.
      # `apps/api/src/worker.ts` constructs no `SecurityRuntime` — the only
      # place one is built is `apps/api/src/app.ts:203` — so nothing in this
      # process runs Argon2id at m = 1 GiB today. It mounts `master_key`
      # because `@core/config` requires the secret for role `worker`
      # (packages/config/src/schema.ts:229), which is a file read, not a
      # derivation.
      #
      # That matters for the "whole stack under 2 GB" target (master plan
      # §3.4): with the worker at 512M a simultaneous cold start peaks near
      # 1.4 GiB rather than 2.4 GiB. **Phase 1 must raise this back to 1536M in
      # the same PR that makes the worker unlock the keyring** (the first sync
      # job that decrypts a provider credential) — at 512M the KEK derivation
      # is OOM-killed at exit 137 with no output, which is precisely how the
      # api failure presented.
      #
      # gate-security-review.md §8.5 N-4: Phase 1 DID make the worker unlock the
      # keyring (apps/api/src/worker.ts's `box.unlock`) and did NOT raise this,
      # and the paragraph above turned out to be an exact prediction. Observed on
      # the re-gate stack: 189 silent restarts, never a line past "configuration
      # loaded", so the consumer pump, the job runner and the SCHEDULER never
      # started — the `schedules` table stayed empty and a queued
      # `connections.sync` sat `pending` forever. Raised to 1536M, matching the
      # api, which pays the identical Argon2id cost. KEK_ARGON2_MEMORY_KIB
      # defaults to 1048576 (1 GiB), so any limit at or below that is a silent
      # crash loop; `regate-worker-boot.test.ts` now pins limit > KEK memory.
      resources: { limits: { cpus: '1.0', memory: 1536M } }

  migrator:
    <<: *app-image
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }
    environment:
      TZ: UTC
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The migrator applies DDL and never mints a WebAuthn challenge, but
      # `loadConfig()` validates the whole configuration for every role — and
      # in production it refuses the `localhost` default outright. Without
      # these two the migrator exits 1 before the first migration, and because
      # api and worker both `depends_on: migrator: service_completed_successfully`,
      # the entire stack fails to start. Observed exactly that while verifying
      # this change. Same values as api/worker, for the same reason they exist.
      AUTH_RP_ID: ${PUBLIC_HOST:-personalfi.lan}
      AUTH_ALLOWED_ORIGINS: https://${PUBLIC_HOST:-personalfi.lan}${EXTRA_ALLOWED_ORIGINS:+,${EXTRA_ALLOWED_ORIGINS}}
      SECRETS_DIR: /run/secrets
      ROLE: migrator
    secrets: [database_url]
    networks: [backend]
    tmpfs: ['/tmp:size=16m,mode=1777,noexec,nosuid,nodev']
    user: '10001:10001'
    depends_on:
      db: { condition: service_healthy }

  db:
    <<: *common
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    networks: [backend]
    user: '70:70'
    read_only: false # postgres needs to write its own data dir; scoped to the named volume below.
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: personalfi
      POSTGRES_DB: personalfi
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8 --data-checksums'
    secrets: [pg_password]
    volumes:
      # Postgres 18 images store data in a major-version subdirectory and
      # expect the mount one level up, at /var/lib/postgresql — same path
      # compose.dev.yml uses, and for the same reason (see that file's
      # comment). The backup/restore scripts and this path must always agree.
      - pgdata:/var/lib/postgresql
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
      - /run/postgresql:size=64m,uid=70,gid=70
    shm_size: '256m'
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - wal_level=replica
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personalfi -d personalfi']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources: { limits: { cpus: '2.0', memory: 1G } }

  backup:
    <<: *common
    image: ${REGISTRY:-personalfi}/backup:${PERSONALFI_VERSION:-dev}
    build:
      context: docker
      dockerfile: backup.Dockerfile
    networks: [backend]
    user: '10002:10002'
    environment:
      TZ: UTC
      PGHOST: db
      PGUSER: personalfi
      PGDATABASE: personalfi
      PGPASSWORD_FILE: /run/secrets/pg_password
      AGE_RECIPIENTS_FILE: /run/secrets/age_recipient
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      # Empty (default) = local-only backups. Set to e.g. "b2:personalfi-backups"
      # to also push to Backblaze B2 — see RUNBOOK.md.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      B2_KEY_ID_FILE: /run/secrets/b2_key_id
      B2_APPLICATION_KEY_FILE: /run/secrets/b2_application_key
    secrets: [pg_password, age_recipient, b2_key_id, b2_application_key]
    volumes:
      - backups:/backups
    tmpfs: ['/tmp:size=256m,mode=1777,noexec,nosuid,nodev']
    depends_on:
      db: { condition: service_healthy }
      # R-13 (gate-security-review-2.md): without this, a cold `docker
      # compose up` started `backup` as soon as `db` reported healthy, which
      # is before `migrator` has created a single table. `backup-loop.sh`'s
      # startup attempt then dumped an empty schema, `backup.sh`'s structural
      # guard correctly refused to promote it (0 TOC entries < MIN_TOC_ENTRIES
      # 10), and the container went `unhealthy` — a real control firing on a
      # startup-ordering bug, not a backup problem. Waiting for the migrator's
      # exit here removes the race outright; `backup-loop.sh`'s own
      # `wait_for_schema` is the second, defense-in-depth layer for anyone who
      # starts `backup` with `--no-deps` or restarts it alone.
      migrator: { condition: service_completed_successfully }
    healthcheck:
      # Reads the status file backup.sh writes on every attempt: a failed or
      # stale backup is `unhealthy`, not just a missing process (H-2). See
      # docker/backup/healthcheck.sh.
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 5m
      timeout: 10s
      start_period: 30s
      retries: 1
    deploy:
      resources: { limits: { cpus: '0.50', memory: 256M } }

  # ---------- profile: sidecar (Phase 6, D23) ----------
  # Placeholder only — proves the network/profile wiring now so a future WP
  # adds services, not topology. Does nothing: sleeps forever, never listens,
  # never reaches `backend` (db) or `frontend`.
  sidecar-placeholder:
    <<: *common
    profiles: ['sidecar']
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    networks: [sidecar]
    user: '65534:65534' # nobody:nobody
    command: ['sleep', 'infinity']
    tmpfs: ['/tmp:size=8m']
    deploy:
      resources: { limits: { cpus: '0.10', memory: 32M } }

  # ---------- profile: local-llm (Phase 5, WP 5.2) ----------
  # The local model runtime. Profile-gated because it budgets several GB of
  # RAM (06 §2.5) that most `up`s should not pay for. RUNBOOK.md "Local model
  # (profile `local-llm`)" is the operator's page; docs/evidence/phase-5/
  # wp5.2-local-model.md is the proof.
  #
  # The sandbox, line by line:
  #   * image: upstream `ollama/ollama` (MIT), pinned by the multi-arch index
  #     digest resolved with `docker buildx imagetools inspect
  #     ollama/ollama:0.34.2` on 2026-09-29. 0.34.2 (pushed 2026-09-17) is the
  #     newest release older than the seven-day minimumReleaseAge; 0.34.3 was
  #     six days old and 0.34.4 (`latest`) five. Recorded in THIRD_PARTY.md.
  #   * networks: `llm` and nothing else. `llm` is `internal: true` — no route
  #     off the host — and its only other member is `worker`, which listens on
  #     no port. Not `backend` (db), not `sidecar` (Phase 6's placeholder: the
  #     two placeholders used to share it, 05 §2), not `frontend`. `api` does
  #     not join: it runs no local model (WP 5.1's `insights.run_local` lane is
  #     the worker's). No published port, no `expose` beyond the image's own.
  #   * user 10003: the image has no USER line and would run as root. The
  #     model store is the `ollama_models` volume mounted at /var/tmp — the
  #     one directory in this image that is world-writable (1777) — because a
  #     fresh named volume copies the mode of the image directory it is first
  #     mounted over, which is how a non-root uid gets a writable store with
  #     no root init step and no custom image. Read-only here: the runtime
  #     never writes a weight (OLLAMA_NOPRUNE stops the startup prune), so a
  #     compromised runtime cannot alter the model it will serve next.
  #   * read_only rootfs, cap_drop ALL, no-new-privileges (x-common); HOME on
  #     the tmpfs, where Ollama keeps a registry keypair it never uses here.
  #   * no secret, no credential, no environment from `.env` but the model
  #     name the pull needs (and not even that on this service).
  #   * OLLAMA_DEBUG=0: at debug level Ollama logs prompt content, and the
  #     logs land in json-file on the host disk, outside the backup's
  #     encryption. The gate greps this container's logs for a canary rather
  #     than trusting this line.
  #   * limits, from a stated assumption (no model is loaded on this host
  #     while other agents measure — 05 §3 rule 4): a 7–8B instruct model at
  #     Q4_K_M is ~4.7 GB of weights plus ~1 GB of KV cache at num_ctx 8192 and
  #     runtime overhead ⇒ 8G. 4 of the host's 8 threads (Ryzen 5 3501U), so
  #     worker and db keep theirs. 256 pids: the Go server, one runner, their
  #     threads. RUNBOOK "Local model" has the live check that replaces the
  #     assumption with a measurement.
  #   * one model loaded, one request at a time, a short queue: the worker's
  #     lane has concurrency 1, and a parallel slot is a second KV cache.
  ollama:
    <<: *common
    profiles: ['local-llm']
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    networks: [llm]
    user: '10003:10003'
    environment:
      TZ: UTC
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /var/tmp/ollama/models
      OLLAMA_NOPRUNE: 'true'
      OLLAMA_DEBUG: '0'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '4'
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_models:/var/tmp:ro
    tmpfs: ['/tmp:size=64m,mode=1777,noexec,nosuid,nodev']
    healthcheck:
      # The image carries no curl; the CLI asks the server over OLLAMA_HOST.
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      # `pids` here is compose's pids_limit: setting both is refused as
      # "distinct values" by Compose v5.
      resources: { limits: { cpus: '4.0', memory: 8G, pids: 256 } }

  # ---------- profile: local-llm-pull (Phase 5, WP 5.2) ----------
  # The one moment the model runtime touches the internet: operator-initiated,
  # one-shot, on its own non-internal network `llm-pull` that no other service
  # joins — so it reaches neither `backend` (db) nor `llm` (worker). A
  # separate profile, so `--profile local-llm up` never starts it. It runs its
  # own server on loopback only (OLLAMA_HOST 127.0.0.1), pulls
  # LOCAL_MODEL_NAME into the shared `ollama_models` volume (writable here and
  # only here), prints the sha256 of every manifest — the digest GET
  # /api/tags reports, i.e. LOCAL_MODEL_DIGEST — and exits. RUNBOOK.md "Local
  # model" → Pull and pin.
  ollama-pull:
    <<: *common
    restart: 'no'
    profiles: ['local-llm-pull']
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    networks: [llm-pull]
    user: '10003:10003'
    environment:
      TZ: UTC
      HOME: /tmp
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /var/tmp/ollama/models
      OLLAMA_DEBUG: '0'
      LOCAL_MODEL_NAME: ${LOCAL_MODEL_NAME:-}
    volumes:
      - ollama_models:/var/tmp
    tmpfs: ['/tmp:size=64m,mode=1777,noexec,nosuid,nodev']
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -eu
        [ -n "$${LOCAL_MODEL_NAME}" ] || { echo 'ollama-pull: set LOCAL_MODEL_NAME in .env' >&2; exit 2; }
        ollama serve >/dev/null 2>&1 &
        server=$$!
        i=0
        until ollama list >/dev/null 2>&1; do
          i=$$((i + 1)); [ "$$i" -lt 30 ] || { echo 'ollama-pull: the server did not start' >&2; exit 1; }
          sleep 1
        done
        ollama pull "$${LOCAL_MODEL_NAME}"
        echo 'ollama-pull: manifest digests — LOCAL_MODEL_DIGEST is sha256:<the hex on your model line>'
        find "$${OLLAMA_MODELS}/manifests" -type f -exec sha256sum {} +
        kill "$$server"
    deploy:
      resources: { limits: { cpus: '1.0', memory: 1G, pids: 256 } }

  # ---------- profile: webhooks (optional, D12/06 §3.3) ----------
  # Placeholder for the future minimal-exposure webhook listener. Off by
  # default: the default deployment has no public listener at all (polling
  # is the primary Plaid sync path — D12).
  #
  # On `ingress`, not `backend` (M-5): this is the one placeholder destined to
  # become an internet-reachable service, and on `backend` an RCE in it would
  # have reached Postgres directly with no pivot — contradicting the comment at
  # the top of this section, which the other two placeholders honour.
  #
  # When a real listener replaces `sleep infinity`, it talks to the API over an
  # internal HTTP route and nothing else: the API joins `ingress` with a
  # listener-facing route (signature-verified, no session cookie, enqueue-only),
  # and this service gets no database credential, no `master_key`, and no
  # membership of `backend`. A webhook is an untrusted POST from the public
  # internet; it earns exactly one narrow door.
  webhooks-placeholder:
    <<: *common
    profiles: ['webhooks']
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    networks: [ingress]
    user: '65534:65534'
    command: ['sleep', 'infinity']
    tmpfs: ['/tmp:size=8m']
    deploy:
      resources: { limits: { cpus: '0.10', memory: 32M } }
