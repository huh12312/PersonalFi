# SPDX-License-Identifier: MIT
#
# Development database, plus an opt-in `dev-sinks` profile.
#
# The production stack — Caddy, api, worker, migrator, backup, and the hardening
# that goes with them — is WP 0.4's, and deliberately not here: a dev compose file
# that quietly grows into a production one is how a bind on 0.0.0.0 ends up in
# front of a ledger.
#
#   just db-up      start it
#   just migrate    apply migrations
#   just db-down    stop it (keeps the volume)
#   just db-reset   stop it and destroy the volume
#
#   docker compose -f compose.dev.yml --profile dev-sinks up -d   start db + the sinks below
#   docker compose -f compose.dev.yml --profile dev-sinks down    stop them
#
# `dev-sinks` (`wp3.14-carryovers.md` item 3, carried from WP 3.13's own
# `Owns` list — `docker/compose.dev-sinks.yml`, named in 03-phase-3-dispatch.md
# §3, never landed): `mailpit` and `ntfy`, real local sinks for
# `@ctx/notifications`'s SMTP and ntfy channels, so `apps/api/test/db/
# notifications-delivery.test.ts` can prove a delivery actually lands
# somewhere instead of trusting the channel adapter's own "delivered" return
# value. Off by default (a fresh `docker compose up` never pays for two more
# containers it did not ask for — the same reasoning `compose.yml`'s
# `sidecar`/`local-llm`/`webhooks` placeholders give for their own profiles),
# and held to the exact same P0-6/P0-7 baseline as `db` below: `read_only`,
# `cap_drop: [ALL]`, `security_opt: ['no-new-privileges:true']`, a non-root
# `user`, loopback-only ports. Neither image needs a *documented exception*
# for `missing-read-only` the way `db` does — both are single static Go
# binaries with no database file configured (`ntfy`'s message cache and
# `mailpit`'s mailbox are both in-memory here, never persisted to a volume),
# so the small `tmpfs` mounts below are enough for whatever scratch space
# either wants to open.
#
# **Not wired to send real notifications from a running `apps/api`/`worker`.**
# `compose.dev.yml` runs no `api`/`worker` service at all (see the header
# above) — those exist only in the production `compose.yml` stack. For a
# deployment that *does* run the full stack (`compose.yml` +
# `compose.override.yml`) and wants `NOTIFICATIONS_ALLOWED_HOSTS` pointed at
# these two sinks, see the example block in `compose.override.example.yml`.
# `apps/api/test/db/notifications-delivery.test.ts` itself never goes through
# that env var at all — it calls `@ctx/notifications`'s adapters directly with
# an injected resolver/transport pointed at these containers' published
# loopback ports, the same test-only "swap the validated address for the live
# fixture's" pattern `packages/contexts/notifications/test/
# egress-allowlist.test.ts` already established (`guardDestination`'s "no
# allow private addresses switch, not even for tests" stays true in
# production; this is a test file substituting where the bytes physically go,
# not a policy change).
#
# Not live-verified against the real images in the environment this file was
# written in (`docker images` had neither cached, and this pass had no reason
# to pull ~150 MB of image over the network just to validate two Dockerfiles
# it did not author) — `docker compose --profile dev-sinks config` is clean
# (schema-valid, passes the hardening gate), but an actual `up` of these two
# services has not been observed. Recorded as an open item in
# `docs/evidence/phase-3/wp3.14-carryovers.md` rather than claimed as tested.

name: personalfi-dev

# WP 10.5: the data volume's name is scoped to the compose project.
#
# Before this, `pgdata` was pinned to the literal name `personalfi_dev_pgdata`,
# so any stack built from this file under another project name (`docker compose
# -p wp104 -f compose.dev.yml ...`) mounted the *running* dev database's data
# directory: two postmasters on one directory (the WP 10.4 incident).
#
# The volume is declared in `docker/dev-db/pgdata.yml` as
# `${PERSONALFI_DEV_PGDATA_VOLUME:-${COMPOSE_PROJECT_NAME}-pgdata}`, and that
# include's project directory is `docker/dev-db/projects/<project name>`, whose
# `.env` (if there is one) is read for the include's interpolation. Only
# `docker/dev-db/projects/personalfi-dev/.env` exists, and it sets the existing
# name, so:
#
#   docker compose -f compose.dev.yml config              -> personalfi_dev_pgdata
#   docker compose -p personalfi-dev -f compose.dev.yml config -> personalfi_dev_pgdata
#   docker compose -p wp999 -f compose.dev.yml config      -> wp999-pgdata
#
# Why an include rather than one interpolated `name:`: Compose interpolation has
# defaults and alternates but no substitution or comparison, so no expression
# over `COMPOSE_PROJECT_NAME` (`personalfi-dev`, with a hyphen) can produce the
# existing underscore name for this project and a project-scoped name for every
# other. A per-project `.env` read through the include's project directory is
# the one per-project switch Compose offers. The volume key stays `pgdata`, so
# the db service's mount, its config hash and the hardening gate's
# `pgdata:db` allowance are unchanged, and the running container is not
# recreated by this edit.
include:
  - path: docker/dev-db/pgdata.yml
    project_directory: docker/dev-db/projects/${COMPOSE_PROJECT_NAME}

services:
  db:
    # Pinned to a patch tag, and to Alpine 3.24 to match decision D13. Renovate
    # proposes the bump; nothing floats on its own.
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    # Held to the same P0-6/P0-7 baseline as the production db, and checked by
    # the same gate (scripts/compose-hardening-check.sh runs over *every*
    # compose file). `read_only` is the one documented exception — postgres
    # writes its own data directory — and the exception lives in the gate's
    # exception table with a reason, not in a file the gate skips. uid 70 is
    # the image's own `postgres` user, so this pins what already happened.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    user: '70:70'
    environment:
      POSTGRES_USER: personalfi
      POSTGRES_PASSWORD: personalfi
      POSTGRES_DB: personalfi_dev
      # Deterministic collation: an index built under a different locale is a
      # corruption bug that only shows up on a restore.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=250
    ports:
      # Loopback only, and 5433 so it cannot collide with a system Postgres.
      - '127.0.0.1:5433:5432'
    volumes:
      # Postgres 18 images store data in a major-version subdirectory and expect
      # the mount one level up, at /var/lib/postgresql. Mounting .../data instead
      # makes the container refuse to start. This also matters for WP 0.4: the
      # production volume and the backup scripts must use the same path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personalfi -d personalfi_dev']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------- profile: dev-sinks ----------
  mailpit:
    profiles: ['dev-sinks']
    # Pinned, not `:latest` — Renovate proposes the bump, same as `db` above.
    image: axllent/mailpit:v1.21.3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # mailpit's own image runs as root by default; there is no documented
    # non-root uid to pin the way `db`'s uid 70 pins postgres's own user, so
    # this is an arbitrary unprivileged uid (`nobody:nobody`, the same one
    # `compose.yml`'s placeholder services use) rather than root.
    user: '65534:65534'
    environment:
      TZ: UTC
      # No `MP_DATABASE` set: mailbox is in-memory only, discarded on
      # container stop — there is nothing here worth persisting past one dev
      # session, and an in-memory mailbox is also what keeps `read_only: true`
      # true rather than needing a writable named volume.
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    ports:
      # Loopback only, both non-privileged: 1025 (SMTP) and 8025 (the web UI
      # + the REST API `notifications-delivery.test.ts` polls to confirm a
      # send actually landed, rather than trusting the channel adapter's own
      # "delivered" outcome).
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  ntfy:
    profiles: ['dev-sinks']
    image: binwiederhier/ntfy:v2.11.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    user: '65534:65534'
    command: ['serve']
    environment:
      TZ: UTC
      # ntfy's default listener is :80, a privileged port a non-root uid
      # cannot bind without `cap_add: [NET_BIND_SERVICE]` — widening
      # capabilities to get a port number is exactly backwards, so this picks
      # ntfy's own documented unprivileged alternative instead.
      NTFY_LISTEN_HTTP: ':2586'
      # In-memory cache only (no `NTFY_CACHE_FILE`), same reasoning as
      # mailpit's `MP_DATABASE` above — nothing persisted, `read_only: true`
      # stays true. `poll=1` reads from this cache (ntfy's default 12 h
      # retention), which is what the delivery test polls after a send.
      NTFY_CACHE_DURATION: '12h'
      NTFY_AUTH_DEFAULT_ACCESS: 'read-write'
      NTFY_BEHIND_PROXY: 'false'
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      # Defensive only: ntfy is not given `NTFY_CACHE_FILE`/`NTFY_AUTH_FILE`
      # so it should never need either directory, but both exist under
      # `read_only: true` in case the binary still probes for them at boot.
      - /var/cache/ntfy:size=16m
      - /var/lib/ntfy:size=16m
    ports:
      - '127.0.0.1:2586:2586'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:2586/v1/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
