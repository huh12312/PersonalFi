# SPDX-License-Identifier: MIT
packages:
  - apps/*
  - packages/*
  - packages/contexts/*
  # One package per provider adapter, plus `port` — the `Connector` interface
  # they implement. Separate packages rather than directories inside
  # `@ctx/connections` because `personalfi/layer-imports` denies
  # `packages/connectors/*` -> `@ctx/*`: see packages/connectors/port/OWNERSHIP.md.
  - packages/connectors/*
  # Phase 5 (05-phase-5-dispatch.md §4 item 2). One package per model runtime —
  # `@advisor/local-model` is the first — same shape as `packages/connectors/*`
  # above and for the same reason: `personalfi/layer-imports` denies
  # `packages/advisors/*` -> `@ctx/*`, so a model adapter cannot become the LLM
  # client `@ctx/insights`'s own layer comment promises it will never be.
  - packages/advisors/*

# Decision D14: a package must have been public for seven days before we will
# install it. The May 2026 TanStack worm shipped with valid SLSA attestations;
# a cooldown is the only control that would have caught it. Renovate uses the
# same window, so proposals and installs agree.
minimumReleaseAge: 10080

# .npmrc sets ignore-scripts=true globally. Every postinstall in the tree must be
# named here with a verdict, so "does anything run code at install time?" has a
# written answer rather than a shrug.
allowBuilds:
  # Dev-only (@vitejs/plugin-react). Same shape as esbuild: the platform binary is
  # an optional dependency; the postinstall only validates it.
  '@swc/core': false
  # Dev-only (vite/vitest/drizzle-kit). esbuild's postinstall only validates the
  # platform binary that its optional dependency already provides, so skipping it
  # costs nothing and removes the last install-time script in the tree.
  esbuild: false
  # lefthook's postinstall runs `lefthook install`; we run that explicitly via
  # `just hooks` instead of at install time. Its binary ships as an optional dep.
  lefthook: false

# Dependency overrides (pnpm 12 reads them here, not package.json). js-yaml:
# @hey-api/json-schema-ref-parser pins 4.2.0, which carries CVE-2026-59869,
# CVE-2026-84375 and GHSA-5p4m-2wfm-xmqj (all fixed in 4.3.x); a devDependency
# never shipped, but a snooze that was about to lapse. 4.3.2 is 2026-08-26,
# past the seven-day cooldown. Remove the override when the parser moves on.
overrides:
  js-yaml: 4.3.2
