# SPDX-License-Identifier: MIT
#
# Template for a local `compose.override.yml` layered on top of the hardened
# production `compose.yml` (docker compose reads `compose.override.yml`
# automatically, with no `-f` flag, if it exists next to `compose.yml`).
#
# Copy this file to `compose.override.yml` (gitignored) and trim it to what
# you actually need. Nothing here is required for `docker compose up` to
# work — it exists for the handful of things that are awkward with the
# production file's hardening turned all the way up:
#
#   * a psql/pgAdmin GUI client on the host,
#   * reading `docker compose logs` without `-f` chasing rotated files,
#   * loosening `read_only`/`cap_drop` temporarily while debugging a container
#     that will not start, rather than editing compose.yml itself and
#     forgetting to revert it.
#
# Do not use this file's patterns as a template for compose.yml itself — the
# whole point of compose.yml is that these exceptions are opt-in and local,
# never the default a fresh clone gets.

services:
  # Publish Postgres to loopback so a host GUI client (TablePlus, DBeaver,
  # `psql` outside the container) can connect directly. Never uncomment the
  # equivalent for a shared/LAN host — this is for a single-developer machine
  # only, and it is still loopback-only, never 0.0.0.0.
  # db:
  #   ports:
  #     - '127.0.0.1:5432:5432'

  # Relax the API's read-only rootfs while iterating on something that writes
  # somewhere unexpected (a stray temp file, a misconfigured cache dir). Find
  # the real fix before removing this override — `read_only: true` in
  # compose.yml is load-bearing, not decorative.
  # api:
  #   read_only: false

  # Bump log verbosity locally without touching the checked-in default.
  # api:
  #   environment:
  #     LOG_LEVEL: debug
  # worker:
  #   environment:
  #     LOG_LEVEL: debug

  # Widen the proxy's LAN bind so a phone/tablet on the same network can reach
  # it without Tailscale. Still never 0.0.0.0 on a machine holding financial
  # data — use the actual LAN IP of the host.
  # proxy:
  #   ports:
  #     - '192.168.1.50:443:8443'
  #     - '192.168.1.50:80:8080'

  # Turn on Plaid's widened CSP (C-3, gate-security-review.md §2.2 F-2/§6 C-3)
  # without editing .env. The *preferred* place for this is `.env.example`'s
  # PLAID_ENABLED — compose.yml already reads `${PLAID_ENABLED:-false}` on
  # proxy/api/worker, so setting it in `.env` is enough on its own and this
  # override is redundant with that. It exists here anyway for the same
  # reason the rest of this file does: a quick local flip while iterating,
  # with nothing to remember to revert in a file compose reads unconditionally.
  # Set all three together, and only once secrets/plaid_client_id and
  # secrets/plaid_secret actually have content — a `true` here with empty
  # secret files widens the CSP for a connector that never registers.
  # proxy:
  #   environment:
  #     PLAID_ENABLED: 'true'
  # api:
  #   environment:
  #     PLAID_ENABLED: 'true'
  # worker:
  #   environment:
  #     PLAID_ENABLED: 'true'

  # WP 4.12b, C-16 (G3-9, `gate-security-review.md` §3.9): this block used to
  # suggest pointing a real api/worker's notification channels at
  # compose.dev.yml's `dev-sinks` profile (mailpit + ntfy) by allow-listing
  # them here. **That can never work, and the gate proved it from inside a
  # real worker container**: `mailpit`/`ntfy` resolve to addresses in the
  # `personalfi_backend` network's private range, and the egress guard's
  # private-range refusal is not configurable by any allow-list — widening
  # `NOTIFICATIONS_ALLOWED_HOSTS` narrows *which* public host may be dialled,
  # never *whether* a private one may be. ntfy's dev-sink port (2586) is also
  # plain HTTP, which `allowedSchemes`/`allowedPorts` refuse independently of
  # the host question. Observed: ntfy on 443 → `resolves to … (private)`; ntfy
  # on 2586 → `port 2586 is not allowed`; SMTP to mailpit:465 → `resolves to …
  # (private)`.
  #
  # The dev sinks are for `apps/api/test/db/notifications-delivery.test.ts`'s
  # own idiom instead: the full guard runs, then only the socket target is
  # swapped to the sink's address with `secure: false` — proving the guard and
  # the transport without ever pointing the *production* egress path at a
  # private address. There is no compose override that reaches the same
  # result, because the guard is doing exactly what it is supposed to do here.
